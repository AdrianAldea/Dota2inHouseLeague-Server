<h1>⚔️ IHL Dota 2 Bot</h1>
    <p class="subtitle">Admin Dashboard — Control Panel</p>

    <!-- SERVER CONTROLS -->
    <h2 class="section-title">Core Servers</h2>
    <div class="grid-2">
        <card-component
            title="Discord Bot Server"
            startEndpoint="/discord/api/server/start"
            stopEndpoint="/discord/api/server/stop"
            [startPayload]="{ 
                username: discordUsername,
                password: discordPassword,
            }"
            [stopPayload]="{}"
        >
            
            <ng-template #inputs let-send="send">
                <div class="form-grid">

                    <div class="form-group">
                        <label>Username</label>
                        <input [(ngModel)]="discordUsername" placeholder="Username" />
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <input [(ngModel)]="discordPassword" type="password" placeholder="Password" />
                    </div>

                </div>
            </ng-template>

        </card-component>

        <card-component
            title="Game Manager Server"
            [startEndpoint]="'/gamemanager/api/server/start'"
            [startPayload]="{ 
                username: gameManagerUsername, 
                password: gameManagerPassword
            }"
        >

            <ng-template #inputs let-send="send">
            <div class="form-grid">

                <div class="form-group">
                    <label>Username</label>
                    <input [(ngModel)]="gameManagerUsername" placeholder="Username" />
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input [(ngModel)]="gameManagerPassword" type="password" placeholder="Password" />
                </div>

            </div>
            </ng-template>

        </card-component>
    </div>

    <!-- GAME MANAGER ENDPOINTS -->
    <h2 class="section-title">Game Manager Tools</h2>
    <div class="grid-2">
        <!-- CREATE LOBBY -->
        <card-component
            title="Create Lobby"
            startLabel="Execute"
            startEndpoint="/gamemanager/api/gamemanager/create"
            [startPayload]="{ lobbyName: createLobbyName, lobbyPassword: createLobbyPassword }"
        >
            <ng-template #inputs>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Lobby Name</label>
                        <input [(ngModel)]="createLobbyName" placeholder="Dota 123" />
                    </div>
                    <div class="form-group">
                        <label>Lobby Password</label>
                        <input [(ngModel)]="createLobbyPassword" placeholder="Pass123" />
                    </div>
                </div>
            </ng-template>
        </card-component>

        <!-- REGISTER PLAYER -->
        <card-component
            title="Register Player"
            startLabel="Execute"
            startEndpoint="/gamemanager/api/gamemanager/register"
            [startPayload]="{ steamId: steamId, userId: userId }"
        >
            <ng-template #inputs>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Steam ID (ulong)</label>
                        <input [(ngModel)]="steamId" placeholder="765611..." />
                    </div>
                    <div class="form-group">
                        <label>User ID (ulong)</label>
                        <input [(ngModel)]="userId" placeholder="123456..." />
                    </div>
                </div>
            </ng-template>
        </card-component>

        <!-- GET PROFILE -->
        <card-component
            title="Lobby Profile"
            startLabel="Execute"
            startEndpoint="/gamemanager/api/gamemanager/profile"
            [startPayload]="{ lobbyName: profileLobbyName, lobbyPassword: profileLobbyPassword }"
        >
            <ng-template #inputs>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Lobby Name</label>
                        <input [(ngModel)]="profileLobbyName" placeholder="Dota 123" />
                    </div>
                    <div class="form-group">
                        <label>Lobby Password</label>
                        <input [(ngModel)]="profileLobbyPassword" placeholder="Pass123" />
                    </div>
                </div>
            </ng-template>
        </card-component>

        <!-- INVITE PLAYERS -->
        <card-component
            title="Invite Players"
            startLabel="Execute"
            startEndpoint="/gamemanager/api/gamemanager/invite"
            [startPayload]="{ playerIds: playerIdsInput.split(',') }"
        >
            <ng-template #inputs>
                <div class="form-group" style="grid-column: span 2;">
                    <label>Player IDs (Comma separated)</label>
                    <input [(ngModel)]="playerIdsInput" placeholder="ID1, ID2, ID3" />
                </div>
            </ng-template>
        </card-component>
    </div>
