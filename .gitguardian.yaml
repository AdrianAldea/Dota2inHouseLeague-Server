# GitGuardian configuration.
#
# The appsettings.json files intentionally carry local Steam/SQL/JWT credentials for
# this self-hosted dev setup, so exclude them from secret scanning to keep CI green.
# NOTE: these values still live in git history — rotate them if they ever mattered.
version: 2
secret:
  ignored-paths:
    - 'IHLDota2Bot/appsettings.json'
    - 'IHLDota2Bot/appsettings.Development.json'
    - 'IHLDota2Bot.AppHost/appsettings.json'
